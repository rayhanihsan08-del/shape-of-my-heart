
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost in the Signal</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030303;
  color: #ddd;
  font-family: "Courier New", monospace;
  height: 100vh;
  overflow: hidden;
}

.screen {
  position: relative;
  height: 100vh;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at center,
    #111 0%, #050505 55%, #000 100%);
}

/* Scanlines */
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    transparent 0px,
    transparent 3px,
    rgba(255,255,255,.035) 4px
  );
  z-index: 5;
}

/* Noise */
.noise {
  position: absolute;
  inset: -50%;
  width: 200%;
  height: 200%;
  opacity: .05;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation: noise 0.2s steps(2) infinite;
}

@keyframes noise {
  0% { transform: translate(0,0); }
  25% { transform: translate(2%,-1%); }
  50% { transform: translate(-1%,2%); }
  75% { transform: translate(1%,1%); }
  100% { transform: translate(-2%,-1%); }
}

.content {
  position: relative;
  z-index: 2;
  text-align: center;
  width: 95%;
  max-width: 1000px;
}

.small {
  color: #555;
  font-size: 11px;
  letter-spacing: 5px;
  margin-bottom: 45px;
}

.lyric {
  min-height: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.text {
  font-size: clamp(35px, 8vw, 95px);
  line-height: 1.2;
  font-weight: bold;
  letter-spacing: -2px;
  text-transform: uppercase;
  white-space: pre-line;
  color: #d5d5d5;
  text-shadow:
    0 0 5px rgba(255,255,255,.2),
    2px 0 #222,
    -2px 0 #333;
  animation: glitch .3s infinite;
}

@keyframes glitch {
  0% {
    transform: translate(0);
    opacity: 1;
  }
  20% {
    transform: translate(-2px,1px);
  }
  40% {
    transform: translate(2px,-1px);
    opacity: .85;
  }
  60% {
    transform: translate(-1px,2px);
  }
  80% {
    transform: translate(1px,-2px);
    opacity: 1;
  }
  100% {
    transform: translate(0);
  }
}

.fade {
  animation: fade .8s ease forwards;
}

@keyframes fade {
  from {
    opacity: 0;
    filter: blur(8px);
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
}

.controls {
  margin-top: 50px;
}

button {
  font-family: inherit;
  background: transparent;
  color: #888;
  border: 1px solid #333;
  padding: 12px 28px;
  cursor: pointer;
  letter-spacing: 4px;
  font-size: 12px;
  transition: .3s;
}

button:hover {
  color: white;
  border-color: #aaa;
  box-shadow: 0 0 15px #333;
}

.footer {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #333;
  font-size: 10px;
  letter-spacing: 3px;
}

.status {
  margin-top: 20px;
  font-size: 10px;
  color: #444;
  letter-spacing: 2px;
}

@media(max-width:600px) {
  .text {
    font-size: 36px;
    letter-spacing: -1px;
  }

  .small {
    font-size: 9px;
    letter-spacing: 3px;
  }
}
</style>
</head>

<body>

<div class="screen">
  <div class="noise"></div>

  <div class="content">

    <div class="small">
      UNKNOWN SIGNAL // 001
    </div>

    <div class="lyric">
      <div class="text fade" id="text">
        SIGNAL LOST
      </div>
    </div>

    <div class="controls">
      <button id="play">▶ PLAY</button>
    </div>

    <div class="status" id="status">
      SYSTEM STANDBY
    </div>

  </div>
</div>

<div class="footer">
  CONNECTION ESTABLISHED // 2026
</div>

<script>

// GANTI TEKS DI SINI SESUKAMU
// Teks ini contoh original, bukan lirik lagu berhak cipta.

const lines = [
  "BUT YOU SHOULD KNOW THAT I DIED SLOW",
  "RUNNING THROUGH THE HALLS OF YOUR HAUNTED HOME",
  "AND THE TOUGHEST PART IS THAT WE BOTH KNOW",
  "WHAT HAPPENED TO YOU",
  "WHY YOU'RE OUT ON YOUR OWN",
  "MEERY CHRISTMAS, PLEASE DON'T CALL",

];
let index = 0;
let playing = false;
let interval;

const text = document.getElementById("text");
const button = document.getElementById("play");
const status = document.getElementById("status");

// Ganti teks dengan efek glitch
function showLine() {
  text.classList.remove("fade");

  // Force animation restart
  void text.offsetWidth;

  text.textContent = lines[index];
  text.classList.add("fade");

  index++;

  if (index >= lines.length) {
    index = 0;
  }
}

// Musik elektronik sederhana dibuat langsung
// menggunakan Web Audio API.
// Tidak perlu file musik tambahan.

let audioContext;
let master;
let oscillators = [];
let musicTimer;

function startMusic() {
  audioContext = new (
    window.AudioContext || window.webkitAudioContext
  )();

  master = audioContext.createGain();
  master.gain.value = 0.08;
  master.connect(audioContext.destination);

  // Chord ambient
  const notes = [110, 130.81, 164.81, 196];

  notes.forEach((freq, i) => {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    gain.gain.value = 0.15;

    osc.connect(gain);
    gain.connect(master);

    osc.start();

    oscillators.push(osc);
  });

  // Bass pulse
  let beat = 0;

  musicTimer = setInterval(() => {
    if (!audioContext) return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "triangle";
    osc.frequency.value =
      beat % 2 === 0 ? 55 : 65.4;

    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.7
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start();
    osc.stop(audioContext.currentTime + 0.7);

    beat++;
  }, 800);
}

function stopMusic() {
  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  clearInterval(musicTimer);
}

button.addEventListener("click", async () => {

  if (!playing) {
    playing = true;

    button.textContent = "■ STOP";
    status.textContent = "PLAYING // TRANSMISSION ACTIVE";

    showLine();

    interval = setInterval(showLine, 3000);

    startMusic();

  } else {
    playing = false;

    clearInterval(interval);
    stopMusic();

    button.textContent = "▶ PLAY";
    status.textContent = "SYSTEM STANDBY";
  }

});

</script>

</body>
</html>
